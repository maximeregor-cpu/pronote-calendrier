name: Synchroniser Pronote

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pronotepy
        run: pip install pronotepy

      - name: Générer edt.ics
        env:
          PRONOTE_USER: ${{ secrets.PRONOTE_USER }}
          PRONOTE_PASS: ${{ secrets.PRONOTE_PASS }}
        run: python sync.py

      - name: Publier edt.ics sur gh-pages
        run: |
          mkdir -p public
          cp edt.ics public/edt.ics
          cd public
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add edt.ics
          git commit -m "Mise à jour EDT"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
