name: Mise à jour emploi du temps

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pronotepy

      - run: python sync.py
        env:
          PRONOTE_USER: ${{ secrets.PRONOTE_USER }}
          PRONOTE_PASS: ${{ secrets.PRONOTE_PASS }}

      - name: Publier le calendrier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edt.ics
          if git diff --cached --quiet -I'^DTSTAMP' -- edt.ics; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour de l'emploi du temps"
            git push
          fi
